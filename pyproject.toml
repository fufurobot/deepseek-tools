[project]
name = "deepseek-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fufu", email = "fufurobot@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dsh-python-bridge>=0.0.1",
    "jinja2>=3.1.6",
    "playwright>=1.58.0",
    "pynput>=1.8.1",
    "pyperclip>=1.11.0",
    "requests>=2.33.1",
]

[project.scripts]
clip-commit = "deepseek_tools.clip_commit:main"
concat-repo = "deepseek_tools.concat_repo:main"
auto-commit = "deepseek_tools.git_auto_commit:main"
git-cloner = "deepseek_tools.git_cloner:main"
ollama-finetuner = "deepseek_tools.ollama_finetuner:main"
rwkv7-trainer = "deepseek_tools.rwkv7_trainer:main"
pwcodegen = "deepseek_tools.pwcodegen:main"
deepseek-chat-export = "deepseek_tools.deepseek_chat_export:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

# Desktop-automation helpers used to record Playwright codegen windows and
# capture screenshots. Kept in a separate group because pyautogui needs a
# desktop session and pulls in platform-specific build steps:
#     uv sync --group gui
gui = [
    "pyautogui>=0.9.54",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that drive a real desktop (skipped without a display)",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
