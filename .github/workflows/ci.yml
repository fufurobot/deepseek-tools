name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10","3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The DeepSeek-V4-Flash submodule points at a large Hugging Face
          # repository and is not needed to run the test suite.
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project and dev dependencies
        # The `gui` group (pyautogui) is intentionally excluded: it needs a
        # desktop session and platform-specific build steps.
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run the test suite
        run: uv run --no-sync pytest -p no:cacheprovider -q

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            *.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and attach release distributions
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify release tag matches project version
        shell: bash
        run: |
          version="$(uv version --short)"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Build wheel and source distribution
        run: uv build

      - name: Attach distributions to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
